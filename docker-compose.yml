services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: iotsimdb
      POSTGRES_USER: iotsim
      POSTGRES_PASSWORD: ${DB_PASS:-iotsimpass123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iotsim -d iotsimdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://iotsim:${DB_PASS:-iotsimpass123}@db:5432/iotsimdb
      JWT_SECRET: ${JWT_SECRET:-change_this_to_random_secret}
      JWT_EXPIRES_IN: 7d
      PORT: 3232
      NODE_ENV: production
      FRONTEND_URL: http://111.68.31.232:8282
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8282:80"
    depends_on:
      - backend
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net:
